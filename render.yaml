services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: dex-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MYSQL_HOST
        sync: false          # set in Render dashboard
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ALLOWED_ORIGINS
        sync: false          # set to your Vercel frontend URL after deploy

  # ── Frontend (React/Vite) ─────────────────────────────────────────────────
  - type: web
    name: dex-ai-frontend
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # set to your Render backend URL e.g. https://dex-ai-backend.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
